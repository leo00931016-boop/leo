<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#222824"><title>PACE 校園運動</title><link rel="stylesheet" href="style.css"><link rel="icon" href="icon.svg"></head><body><svg class="sprite" xmlns="http://www.w3.org/2000/svg"><symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="18" r="3"/><circle cx="18" cy="6" r="3"/><path d="M6 15v-5a4 4 0 0 1 4-4h5M18 9v5a4 4 0 0 1-4 4h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol></svg><aside class="sidebar"><a class="brand" href="./" aria-label="PACE 校園運動首頁"><span class="brand-symbol">//</span>PACE<span class="brand-sub">校園運動</span></a><nav class="sidenav"><a class="active" href="#"><span>開始運動</span></a><a href="#history"><span>歷史紀錄</span></a><a href="#guide"><span>操作說明</span></a></nav></aside><div class="shell"><header class="topbar"><div class="breadcrumb">我的空間 <span>/</span> <strong>開始運動</strong></div><div class="topright"><span class="device-label">個人運動模式 <strong id="badge">● 定位可用</strong></span></div></header><main class="page"><section class="pageheading"><div><div class="overline">YOUR DAILY MOVEMENT</div><h1>校園運動<span class="title-dot">.</span></h1><p>依照自己的節奏，完成今天的練習。</p></div><div class="head-actions"><button id="openSetup" class="ghost">設定</button><button id="locate" class="primary">定位</button></div></section><section class="map-panel"><div id="map" aria-label="校園地圖"></div><div class="map-overlay"><div class="status-card"><span class="status-dot"></span><div><small>目前狀態</small><strong id="message">就緒，按下「開始」開始運動。</strong></div></div><div class="target-card"><small>集合點</small><strong id="targetInfo">點一下地圖，設定老師指定的集合點。</strong><a id="navigate" class="ghost" target="_blank" rel="noreferrer" hidden>導航</a></div></div></section><section class="stats-grid"><article class="stat"><span>累積距離</span><strong id="distance">0.00</strong><small>m</small></article><article class="stat"><span>運動時間</span><strong id="elapsed">00:00</strong><small>min:sec</small></article><article class="stat"><span>平均速度</span><strong id="speed">0.0</strong><small>km/h</small></article><article class="stat"><span>熱量</span><strong id="calories">0</strong><small>kcal</small></article><article class="stat"><span>有效點數</span><strong id="points">0</strong><small>點</small></article><article class="stat"><span>準確度</span><strong id="accuracy">±0</strong><small>m</small></article></section><section class="controls"><button id="start" class="primary">開始</button><button id="pause" class="secondary">暫停</button><button id="finish" class="success">完成</button><button id="clearTarget" class="ghost">清除集合點</button><button id="campus" class="ghost">校園中心</button></section></main></div><dialog id="setupDialog"><div class="dialog-head"><div><span class="overline">BEFORE YOU GO</span><h2>準備開始</h2></div><button id="closeSetup" class="close" aria-label="關閉設定">×</button></div><form id="profile"><label>暱稱<input id="alias" value="我的運動" required></label><label>身高(cm)<input id="height" type="number" min="80" max="250" value="170" required></label><label>體重(kg)<input id="weight" type="number" min="20" max="200" value="60" required></label><label>年齡<input id="age" type="number" min="6" max="120" value="18" required></label><label>活動模式<select id="mode"><option>步行</option><option>慢跑</option><option>跑步</option><option>自行車</option></select></label><button type="submit" class="primary">開始運動</button></form></dialog><dialog id="energyDialog"><div class="dialog-head"><div><h2>熱量如何估算？</h2></div><button id="closeEnergy" class="close" aria-label="關閉說明">×</button></div><p>以你選擇的活動強度與體重作為估算，計算方式採用 ACSM 公式：met × 3.5 × kg / 200 ×（運動時間 / 60）。</p></dialog><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="vendor/leaflet.js"></script><script src="mode.js"></script><script src="tiles.js"></script><script src="core.js"></s
